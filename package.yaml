name:                comp3352-m1-wilson-caldwell
version:             0.1.0.0
github:              "Teddy.Wilson/comp3352-m1-wilson-caldwell"
license:             BSD3
author:              "Wilson Caldwell"
maintainer:          "your.email@example.com"

dependencies:
- base >= 4.7 && < 5
- megaparsec >= 7.0
- mtl
- text
- parser-combinators
- hashable
- containers

library:
  source-dirs: .
  exposed-modules:
    - N1
    - Env
    - CompilerPasses
    - N1Passes
    - C0Passes
    - X86bPasses
    - X86bPasses.Liveness
    - X86b
    - Parsers.NiParser
    - Parsers.CParser
    - C0
  other-modules:
    - Paths_comp3352_m1_wilson_caldwell

executables:
  comp3352-m1-wilson-caldwell-exe:
    main:                Main.hs
    source-dirs:         .
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - comp3352-m1-wilson-caldwell

tests:
  comp3352-m1-wilson-caldwell-test:
    main:                N1PassesSpec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - comp3352-m1-wilson-caldwell
    - hspec
    other-modules:
    - C0PassesSpec
    - X86bPassesSpec
    - X86bPasses.LivenessSpec